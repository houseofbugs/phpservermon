<div class="modal fade" id="{{ modal_id }}Modal" tabindex="-1" aria-labelledby="{{ modal_id }}ModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header border-0 pb-0">
				<h5 class="modal-title d-flex align-items-center gap-2" id="{{ modal_id }}ModalLabel">
					{% if modal_button_type == 'danger' %}<i class="bi bi-exclamation-octagon text-danger"></i>{% endif %}{{ modal_title }}
				</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body text-muted">{{ modal_body|raw }}</div>
			<div class="modal-footer border-0 pt-0">
				{% if has_cancel %}<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ label_cancel }}</button>{% endif %}
				<button type="button" class="btn btn-{{ modal_button_type }} modalOKButton">{{ modal_button_label }}</button>
			</div>
		</div>
	</div>
</div>
