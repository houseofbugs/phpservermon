{% import 'main/macros.tpl.html' as macro %}
<form method="POST" class="d-flex flex-column gap-3">
	{{ macro.input_csrf() }}
	<input type="hidden" name="action" value="login">
	{% if public_page_enabled %}
	<a class="btn btn-ghost w-100 d-flex align-items-center justify-content-between py-2 px-3 mb-1" href="public.php">
		<span class="d-flex align-items-center gap-2"><span class="dot is-up"></span><span class="fw-semibold">View Public Status Page</span></span>
		<i class="bi bi-arrow-up-right"></i>
	</a>
	{% endif %}
	<div class="mb-2">
		<h1 class="mb-1">{{ title_sign_in }}</h1>
		<p class="text-muted mb-0">Welcome back — sign in to your dashboard.</p>
	</div>
	<div>
		<label for="input-username" class="form-label">{{ label_username }}</label>
		<input type="text" name="user_name" id="input-username" class="form-control form-control-lg" value="{{ value_user_name }}" autocomplete="username" required autofocus>
	</div>
	<div>
		<div class="d-flex justify-content-between align-items-center">
			<label for="input-password" class="form-label">{{ label_password }}</label>
			<a class="small mb-1" href="?action=forgot">{{ label_password_forgot }}</a>
		</div>
		<input type="password" id="input-password" name="user_password" class="form-control form-control-lg" autocomplete="current-password" required>
	</div>
	<div class="form-check">
		<input type="checkbox" name="user_rememberme" value="1" class="form-check-input" id="input-rememberme" {{ value_rememberme }}>
		<label class="form-check-label" for="input-rememberme">{{ label_remember_me }}</label>
	</div>
	<button class="btn btn-primary btn-lg w-100" type="submit">{{ label_login }} <i class="bi bi-arrow-right"></i></button>
</form>
