{% block results %}
{% if messages %}
	<ul class="list-unstyled d-flex flex-column gap-2 mb-0">
	{% for msg in messages %}
		<li class="d-flex gap-2 align-items-start small">
			<i class="bi bi-{{ msg.class == 'success' ? 'check-circle-fill text-success' : (msg.class == 'danger' ? 'x-circle-fill text-danger' : (msg.class == 'warning' ? 'exclamation-triangle-fill text-warning' : 'info-circle-fill text-primary')) }}"></i>
			{% autoescape false %}<span>{{ msg.message }}</span>{% endautoescape %}
		</li>
	{% endfor %}
	</ul>
{% endif %}
{% endblock %}
